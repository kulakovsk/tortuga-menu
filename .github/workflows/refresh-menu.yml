name: Refresh menu backup

on:
  push:
    branches: [main]
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tortuga-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build complete backup with photographs
        id: backup
        run: node build-backup.cjs
      - uses: actions/configure-pages@v5
        if: steps.backup.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.backup.outputs.changed == 'true'
        with:
          path: _site
      - name: Publish updated menu
        id: deployment
        if: steps.backup.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
  keep-schedule-active:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep the menu updater active during quiet months
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -ge 2160000 ]; then
            date -u +%FT%TZ > .backup-heartbeat
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .backup-heartbeat
            git commit -m 'Keep automatic menu backup active'
            git push
          fi
