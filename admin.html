<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tortuga — CaptainFlint</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:auto;max-width:880px;padding:24px 16px 70px;background:#14110f;color:#f5ecda;font:16px system-ui}h1,h2{font-family:Georgia;color:#d6b46b}button,input,select{font:inherit;padding:10px;border:1px solid #8c7447;border-radius:8px;background:#261e19;color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:wait}input[type=search]{width:100%}textarea{display:block;width:100%;background:#261e19;color:inherit;border:1px solid #8c7447;border-radius:8px;padding:10px;font:inherit}input,select{max-width:100%}#dishConfirmation{border:2px solid #d6b46b}#dishForm label input:not([type=checkbox]){display:block;width:100%}.card{border:1px solid #65513c;border-radius:12px;margin:14px 0;padding:16px;background:#201b17}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}label{display:block;margin:10px 0}#message{position:sticky;top:0;padding:12px;background:#34291c;white-space:pre-wrap;z-index:2}img{max-width:180px;max-height:140px;display:block;margin:12px 0}.small{color:#c2b39d;font-size:13px}.price{width:110px}[hidden]{display:none!important}</style>
<h1>⚓ CaptainFlint</h1><p class="small">Управление Tortuga. Изменения сохраняются в общей базе. Гостевое меню обновляет данные автоматически.</p>
<p id="message" role="status" aria-live="polite">Войдите для управления меню.</p>
<form id="login" class="card"><label>Логин <input id="username" autocomplete="username" value="CaptainFlint" required></label><label>Пароль <input id="password" type="password" autocomplete="current-password" required></label><button id="signIn">Войти</button></form>
<section id="panel" hidden><div class="row"><button id="reload">Обновить</button><button id="logout">Выйти</button></div><h2>Стоп соусов</h2><div id="sauces" class="card"></div><h2>Меню</h2><input type="search" id="search" placeholder="Название или код блюда"><div id="dishes"></div></section>
<script src="tortuga-admin-config.js?v=20261024c"></script><script src="admin.js?v=20261024c"></script><script src="dish-manager.js?v=20261024c"></script></html>
