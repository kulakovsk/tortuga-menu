function applyReviewedTranslation(x){
 const r=TRANSLATION_REVIEW.items[x.id];
 if(!r||x.ru!==r.source.ru||(x.desc||'')!==r.source.desc)return;
 for(const [field,value] of Object.entries(r.patch))if((x[field]||'')===r.source[field])x[field]=value;
}
function applyReviewedCategories(){
 for(const [id,r] of Object.entries(TRANSLATION_REVIEW.cats)){
  const cat=BASE.cats[id];if(!cat||cat[0]!==r.source[0])continue;
  for(const [l,v] of Object.entries(r.patch)){const i=LANGS.indexOf(l);if(cat[i]===r.source[i])cat[i]=v;}
 }
}
function reviewedOption(o){
 const r=TRANSLATION_REVIEW.options[o.names.ru];
 return r&&o.names.en===r.source[0]&&o.names.zh===r.source[1]?r.patch:[o.names.en,o.names.zh];
}
const BAR_VISIBLE=true;
// Connected v2 release. Bar visible per owner instruction; kitchen opens first.
let menuSection='kitchen';
const barSelected={};
function servingLabel(v){
 const volume=String(v.ml/1000).replace('.',lang==='ru'?',':'.');
 return v.ml===50?{ru:'50 мл',en:'50 ml',zh:'50毫升'}[lang]:
 ({ru:'Бутылка ',en:'Bottle ',zh:'瓶装 '}[lang]+volume+{ru:' л',en:' L',zh:'升'}[lang]);
}
function barServingMarkup(x){
 const label={ru:'Объём',en:'Serving',zh:'规格'}[lang];
 if(x.variants.length===1){const v=x.variants[0];return '<p class="tiny">'+escapeHtml(x.cat==='bar-beer'||x.cat==='bar-zero'?String(v.ml/1000).replace('.',lang==='ru'?',':'.')+{ru:' л',en:' L',zh:'升'}[lang]:servingLabel(v))+'</p>'}
 return '<label class="serving">'+label+'<select data-serving="'+x.id+'">'+x.variants.map(v=>'<option value="'+escapeHtml(v.label)+'" '+((barSelected[x.id]||x.opts[0])===v.label?'selected':'')+'>'+escapeHtml(servingLabel(v))+' · '+v.price+' ₽'+(v.status&&v.status!=='yes'?' · '+(v.status==='no'?words[lang].unavailable:words[lang].later):'')+'</option>').join('')+'</select></label>';
}
function initializeBar(){
 for(const x of BAR.items)x.status='no';
 BASE.items.push(...BAR.items);Object.assign(BASE.cats,BAR.cats);
 for(const [key,r] of Object.entries(TRANSLATION_REVIEW.options))OPT_TRANSLATIONS[key]=r.patch;
 words.ru.notice='⚓ Пробная версия. Уточняйте наличие и состав блюд и напитков у официанта. Заказ не отправляется автоматически.';
 words.en.notice='⚓ Preview menu. Please confirm availability and ingredients of food and drinks with your waiter. Orders are not sent automatically.';
 words.zh.notice='⚓ 试用版菜单。请向服务员确认菜品和饮品的供应情况及配料。订单不会自动发送。';
 const previousRender=render;
 render=function(){
  if(!BAR_VISIBLE)menuSection='kitchen';
  $('menuTabs').style.display=BAR_VISIBLE?'':'none';
  previousRender();document.documentElement.lang=lang;
  $('menuTabs').innerHTML=(BAR_VISIBLE?['kitchen','bar']:[]).map(s=>'<button data-section="'+s+'" class="'+(s===menuSection?'active':'')+'" aria-pressed="'+(s===menuSection)+'">'+({ru:{kitchen:'Кухня',bar:'Бар'},en:{kitchen:'Kitchen',bar:'Bar'},zh:{kitchen:'餐食',bar:'酒吧'}}[lang][s])+'</button>').join('');
  document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{menuSection=b.dataset.section;category='all';$('search').value='';render();$('cats').scrollLeft=0});
  $('search').placeholder={ru:'Поиск по меню',en:'Search menu',zh:'搜索菜单'}[lang];
  $('menuTabs').setAttribute('aria-label',{ru:'Раздел меню',en:'Menu section',zh:'菜单分区'}[lang]);
  $('optionCancel').textContent={ru:'Отмена',en:'Cancel',zh:'取消'}[lang];
  $('closeOption').setAttribute('aria-label',{ru:'Закрыть',en:'Close',zh:'关闭'}[lang]);
  $('clearCart').textContent={ru:'Очистить',en:'Clear',zh:'清空'}[lang];
  const buttons=$('cartDialog').querySelectorAll('.toolbar button');buttons[0].textContent={ru:'Печать',en:'Print',zh:'打印'}[lang];buttons[2].textContent={ru:'Закрыть',en:'Close',zh:'关闭'}[lang];
  document.querySelectorAll('[data-serving]').forEach(s=>s.onchange=()=>{barSelected[s.dataset.serving]=s.value;render()});
 };
 const previousAdd=addItem;
 addItem=async function(id){const clicked=item(id);if(clicked?.bar){if(!BAR_VISIBLE)return;const serving=barSelected[id]||clicked.opts[0];if(!await refreshCloud())return;const x=item(id);if(x&&barState(x,[serving])==='yes'){if(x.flavors?.length)openTinctureChoices(x,serving);else putItem(id,[serving]);}return}return previousAdd(id)};
 render();
}


let tincturePending=null;
function openTinctureChoices(x,requested){
 const serving=requested||barSelected[x.id]||x.variants[0].label;
 const variant=x.variants.find(v=>v.label===serving);
 tincturePending={id:x.id,serving};
 $('tinctureTitle').textContent=x.brand[lang];
 $('tinctureHint').textContent={ru:'Выберите один вкус',en:'Choose one flavour',zh:'请选择一种口味'}[lang]+' · '+servingLabel(variant)+' · '+variant.price+' ₽';
 $('tinctureChoices').innerHTML=x.flavors.map((f,i)=>'<label class="line" style="justify-content:flex-start;cursor:pointer;line-height:1.5"><input type="radio" name="tinctureFlavor" value="'+i+'"> '+escapeHtml(f[lang])+'</label>').join('');
 $('tinctureAdd').textContent={ru:'Добавить в заказ',en:'Add to order',zh:'加入订单'}[lang];
 $('tinctureCancel').textContent={ru:'Отмена',en:'Cancel',zh:'取消'}[lang];
 $('closeTincture').setAttribute('aria-label',{ru:'Закрыть',en:'Close',zh:'关闭'}[lang]);
 $('tinctureDialog').showModal();
}
$('closeTincture').onclick=$('tinctureCancel').onclick=()=>{$('tinctureDialog').close();tincturePending=null};
$('tinctureDialog').addEventListener('cancel',()=>{tincturePending=null});
$('tinctureAdd').onclick=async()=>{
 if(!tincturePending)return;
 const selected=$('tinctureChoices').querySelector('input:checked');
 if(!selected){toast({ru:'Выберите вкус настойки',en:'Please choose a flavour',zh:'请选择浸泡酒口味'}[lang]);return;}
 const pending=tincturePending;
 const flavorName=item(pending.id)?.flavors[Number(selected.value)]?.ru;
 if(!await refreshCloud())return;
 if(tincturePending!==pending)return;
 const x=item(pending.id),flavor=x?.flavors.find(f=>f.ru===flavorName);
 if(!flavor||barState(x,[tincturePending.serving])!=='yes')return;
 putItem(x.id,[tincturePending.serving,flavor.ru]);
 $('tinctureDialog').close();tincturePending=null;
};

initializeBar();refreshCloud();setInterval(()=>{if(!document.hidden)refreshCloud()},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshCloud()});

</script></body></html>
