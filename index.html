 addItem=async function(id){if(item(id)?.bar){if(!await refreshCloud())return;const x=item(id);if(x?.bar&&state(x)==='yes')putItem(id,[barSelected[id]||x.opts[0]]);return}return previousAdd(id)};
 render();
}

initializeBar();refreshCloud();setInterval(()=>{if(!document.hidden)refreshCloud()},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshCloud()});
